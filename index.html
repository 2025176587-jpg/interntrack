<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="InternTrack – track internship applications, interviews and offers.">
<meta name="author" content="IMS566 Student">
<title>Log in | InternTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body>
<div class="login-wrap">
 <section class="login-side">
  <h1><span class="brand-mark">&#9670;</span> InternTrack</h1>
  <p class="lead">Keep every internship application, interview and offer in one place.</p>
  <div class="mt-3 p-3 rounded" style="background:rgba(255,255,255,.1)">
   <strong>Demo login</strong><br>Username: <code class="text-warning">student</code><br>Password: <code class="text-warning">ims566</code></div>
 </section>
 <main class="login-form"><div style="width:100%;max-width:380px">
  <ul class="nav nav-tabs mb-3" role="tablist">
   <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabLogin">Log in</button></li>
   <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabReg">Register</button></li></ul>
  <div id="err" class="alert alert-danger d-none" role="alert"></div>
  <div id="ok" class="alert alert-success d-none" role="status">Account created. Log in below.</div>
  <div class="tab-content">
   <div class="tab-pane fade show active" id="tabLogin"><form id="loginForm" novalidate>
    <label class="form-label" for="lu">Username</label><input id="lu" class="form-control mb-3" autocomplete="username">
    <label class="form-label" for="lp">Password</label><input id="lp" type="password" class="form-control mb-3" autocomplete="current-password">
    <button class="btn btn-mark w-100">Log in</button></form></div>
   <div class="tab-pane fade" id="tabReg"><form id="regForm">
    <label class="form-label" for="rn">Full name</label><input id="rn" class="form-control mb-3" required>
    <label class="form-label" for="ru">Username</label><input id="ru" class="form-control mb-3" required>
    <label class="form-label" for="rp">Password</label><input id="rp" type="password" class="form-control mb-3" required>
    <button class="btn btn-mark w-100">Create account</button></form></div>
  </div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/app.js"></script>
<script>
// The login form pane needs the id on its wrapper for the tab switch
initLogin();
</script></body></html>
